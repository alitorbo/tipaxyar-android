name: Build TipaxYar Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Initialize Capacitor Android Project
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then cp index.html www/index.html; fi
          if [ ! -f "www/index.html" ]; then echo "<h1>TipaxYar</h1>" > www/index.html; fi
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "TipaxYar" "ir.tipaxyar.delivery" --web-dir www
          npx cap add android
          npx cap sync android
          sed -i 's/>TipaxYar</>تیپاکس‌یار</g' android/app/src/main/res/values/strings.xml

      - name: 6. Build Installable APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 7. Prepare Output Deliverables
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/TipaxYar-debug.apk

      - name: 8. Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TipaxYar-Installable-APK
          path: output/TipaxYar-debug.apk
