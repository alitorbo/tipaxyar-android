name: Build TipaxYar Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Initialize Capacitor Android Project
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then cp index.html www/index.html; fi
          if [ ! -f "www/index.html" ]; then echo "<h1>TipaxYar</h1>" > www/index.html; fi
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "TipaxYar" "ir.tipaxyar.delivery" --web-dir www
          npx cap add android
          npx cap sync android
          sed -i 's/>TipaxYar</>تیپاکس‌یار</g' android/app/src/main/res/values/strings.xml

      - name: 5. Build Installable APK via Gradle
        working-directory: ./android
        env:
          ANDROID_HOME: /usr/local/lib/android
